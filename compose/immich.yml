---
# Immich is off (Sep 2026): most original photos have been missing from
# UPLOAD_LOCATION since the March 2026 rebuild, and the DB still lists them.
# Keep it off until they're restored, or the mobile app treats them as backed up.
# Before re-enabling, switch immich-db to the VectorChord image (v3 dropped
# pgvecto.rs), then remove the `profiles: [immich]` lines below.

# Only the variables Immich reads; it used to get the whole .env.
x-immich-env: &immich-env
    TZ: ${TZ}
    IMMICH_VERSION: ${IMMICH_VERSION:-release}
    DB_HOSTNAME: immich-db
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_DATABASE_NAME: ${DB_DATABASE_NAME}
    REDIS_HOSTNAME: immich-redis

services:
    immich-server:
        container_name: immich_server
        profiles: [immich]
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        volumes:
            - ${UPLOAD_LOCATION}:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
        environment: *immich-env
        ports:
            - 2283:2283
        depends_on:
            - immich-redis
            - immich-db
        networks:
            - mariusz-network
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        healthcheck:
            disable: false
        restart: always

    immich-machine-learning:
        container_name: immich_machine_learning
        profiles: [immich]
        image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
        volumes:
            - model-cache:/cache
        environment: *immich-env
        networks:
            - mariusz-network
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        healthcheck:
            disable: false
        restart: always

    immich-db:
        container_name: immich_postgres
        profiles: [immich]
        image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: --data-checksums
        volumes:
            - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
        healthcheck:
            test: >-
                pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
                Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}"
                --tuples-only --no-align
                --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
                echo "checksum failure count is $$Chksum";
                [ "$$Chksum" = '0' ] || exit 1
            interval: 5m
            start_interval: 30s
            start_period: 5m
        command: >-
            postgres
            -c shared_preload_libraries=vectors.so
            -c 'search_path="$$user", public, vectors'
            -c logging_collector=on
            -c max_wal_size=2GB
            -c shared_buffers=512MB
            -c wal_compression=on
        networks:
            - mariusz-network
        restart: always

    immich-redis:
        container_name: immich_redis
        profiles: [immich]
        image: docker.io/redis:6.2-alpine@sha256:148bb5411c184abd288d9aaed139c98123eeb8824c5d3fce03cf721db58066d8
        healthcheck:
            test: redis-cli ping || exit 1
        networks:
            - mariusz-network
        restart: always

networks:
    mariusz-network:

volumes:
    model-cache:
