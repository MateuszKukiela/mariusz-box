---
# One compose project, split into one file per stack under compose/.
# project_directory keeps relative paths and .env resolving from the repo
# root, so `docker compose up -d` here still runs everything.
#
# Paperless is behind a profile and stays off; see compose/paperless.yml.
include:
    - path: compose/infra.yml
      project_directory: .
    - path: compose/media.yml
      project_directory: .
    - path: compose/arr.yml
      project_directory: .
    - path: compose/downloads.yml
      project_directory: .
    - path: compose/sure.yml
      project_directory: .
    - path: compose/apps.yml
      project_directory: .
    - path: compose/paperless.yml
      project_directory: .
    - path: compose/immich.yml
      project_directory: .
