---
# Download clients.
services:
    # Pauses SABnzbd while someone is streaming from Jellyfin.
    debilarr:
        container_name: debilarr
        image: ghcr.io/mateuszkukiela/debilarr:latest
        restart: unless-stopped
        environment:
            JELLYFIN_URL: http://jellyfin:8096
            JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
            SAB_URL: http://sabnzbd:8080
            SAB_API_KEY: ${SAB_API_KEY}
            INTERVAL: '30'
            RESUME_COOLDOWN: '60'
            INCLUDE_PAUSED: 'false'
            LOG_LEVEL: INFO
            TZ: ${TZ}
        networks:
            - mariusz-network
        depends_on:
            - jellyfin
            - sabnzbd

    metube:
        image: ghcr.io/alexta69/metube
        container_name: metube
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        volumes:
            # Only its own folder: it's reachable from the internet, and it
            # keeps its state in /downloads/.metube.
            - /etc/localtime:/etc/localtime:ro
            - ${ROOT_DATA_HDD}/metube:/downloads
        ports:
            - 8085:8081
        networks:
            - mariusz-network
        restart: unless-stopped

    # Set in qBittorrent itself (Tools > Options > Advanced), not here:
    # disk IO type "Simple pread/pwrite" (libtorrent 2's default mmap crawls on
    # ZFS), anonymous mode off (it hides the listen port from peers), UPnP off
    # (the router forwards 6881 to this box), 10 active uploads / 20 active
    # torrents, and the incomplete folder set to /incomplete.
    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        environment:
            - WEBUI_PORT=8082
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        volumes:
            - ${ROOT_APPDATA}/qbittorrent:/config
            - ${ROOT_DATA_HDD}:/hdd
            - ${ROOT_DATA_SSD}:/ssd
            # Incomplete torrents on the KIOXIA: pieces arrive as random 16 KiB
            # writes, which the pool (1M records) turns into read-modify-write.
            # Finished files move to /hdd/downloads/complete in one copy.
            - ${ROOT_INCOMPLETE}:/incomplete
        ports:
            - 8082:8082
            - 6881:6881
            - 6881:6881/udp
        networks:
            - mariusz-network
        restart: unless-stopped

    sabnzbd:
        image: lscr.io/linuxserver/sabnzbd:latest
        container_name: sabnzbd
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        volumes:
            - ${ROOT_APPDATA}/sabnzbd:/config
            - ${ROOT_METADATA}/sabnzbd/logs:/config/logs
            - ${ROOT_DATA_HDD}:/hdd
            - ${ROOT_DATA_SSD}:/ssd
            # In-progress articles, par2 and direct-unpack reads on the KIOXIA;
            # unrar writes straight to /hdd/downloads/complete. SAB's
            # download_dir is /incomplete, with download_free at 100G so it
            # pauses itself long before the NVMe fills.
            - ${ROOT_SAB_INCOMPLETE}:/incomplete
        ports:
            - 8089:8080
        networks:
            - mariusz-network
        restart: unless-stopped

networks:
    mariusz-network:
