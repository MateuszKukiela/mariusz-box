---
# Watching things: Jellyfin and what sits around it.
services:
    comicstreamer:
        container_name: comicstreamer
        image: mateuszkukiela/comicstreamer:latest
        volumes:
            - ${ROOT_APPDATA}/comicstreamer:/config
            - ${ROOT_METADATA}/comicstreamer/logs:/config/logs
            - ${ROOT_DATA_HDD}:/hdd
        ports:
            - 32500:32500
        networks:
            - mariusz-network
        restart: unless-stopped

    filebrowser:
        container_name: filebrowser
        image: filebrowser/filebrowser:s6
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        volumes:
            - ${ROOT_APPDATA}/filebrowser/filebrowser.db:/database/filebrowser.db
            - ${ROOT_APPDATA}/filebrowser/settings.json:/config/settings.json
            - ${ROOT_DATA_HDD}:/srv/hdd
            - ${ROOT_DATA_SSD}:/srv/ssd
        ports:
            - 8250:80
        networks:
            - mariusz-network
        restart: unless-stopped

    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: jellyfin
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - UMASK_SET=022
            - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
            - NVIDIA_VISIBLE_DEVICES=all
            - FFMPEG_ANALYZEDURATION=400M
            - FFMPEG_PROBESIZE=2G
        volumes:
            - ${ROOT_APPDATA}/jellyfin:/config
            - ${ROOT_APPDATA}/jellyfin/config.json:/usr/share/jellyfin/web/config.json
            - ${ROOT_METADATA}/jellyfin/data:/config/data
            - ${ROOT_METADATA}/jellyfin/cache:/config/cache
            - ${ROOT_METADATA}/jellyfin/log:/config/log
            - ${ROOT_DATA_HDD}:/hdd
        ports:
            - 8097:8096
        # NVENC/NVDEC through the NVIDIA container toolkit, see host/README.md.
        runtime: nvidia
        networks:
            - mariusz-network
        restart: unless-stopped

    jellyseerr:
        image: ghcr.io/seerr-team/seerr:latest
        init: true
        container_name: jellyseerr
        environment:
            - LOG_LEVEL=debug
            - TZ=${TZ}
        ports:
            - 5055:5055
        volumes:
            - ${ROOT_APPDATA}/jellyseerr:/app/config
            - ${ROOT_METADATA}/jellyseerr/logs:/app/config/logs
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
            start_period: 20s
            timeout: 3s
            interval: 15s
            retries: 3
        networks:
            - mariusz-network
        restart: unless-stopped

    stash:
        image: ghcr.io/feederbox826/stash-s6:hwaccel
        container_name: stash
        environment:
            - STASH_STASH=/data/
            - STASH_GENERATED=/generated/
            - STASH_METADATA=/metadata/
            - STASH_CACHE=/cache/
            - STASH_PORT=9999
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ${ROOT_APPDATA}/stash/metadata:/metadata
            - ${ROOT_APPDATA}/stash/config:/config
            - ${ROOT_APPDATA}/stash/pip-install:/pip-install
            - ${ROOT_SSD}/stash/cache:/cache
            - ${ROOT_SSD}/stash/blobs:/blobs
            - ${ROOT_SSD}/stash/generated:/generated
            - ${ROOT_DATA_HDD}:/hdd
        ports:
            - 9999:9999
        logging:
            driver: json-file
            options:
                max-file: '10'
                max-size: 2m
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        command: >
            /bin/bash -c "pip install --user --break-system-packages emojis requests lxml stashapp-tools &&
                          exec /bin/bash /opt/entrypoint.sh"
        networks:
            - mariusz-network
        restart: unless-stopped

    streamyfin:
        container_name: streamyfin
        image: fredrikburmester/streamyfin-optimized-versions-server:master
        environment:
            - NODE_ENV=development
            # Only what the server reads; it used to get the whole .env.
            - JELLYFIN_URL=${JELLYFIN_URL}
            - TZ=${TZ}
        ports:
            - 3000:3000
        volumes:
            - ${ROOT_DATA_HDD}/media/cache:/usr/src/app/cache
        networks:
            - mariusz-network
        restart: always

networks:
    mariusz-network:
