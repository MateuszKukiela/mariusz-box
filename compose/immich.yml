---
# Immich, following the official compose file of the v3 release
# (github.com/immich-app/immich/releases/latest/download/docker-compose.yml),
# with our service names, network and GPU. Check that file before upgrading
# across a major version: the database image in particular moves with it.

# Only the variables Immich reads; it used to get the whole .env.
x-immich-env: &immich-env
    TZ: ${TZ}
    DB_HOSTNAME: immich-db
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_DATABASE_NAME: ${DB_DATABASE_NAME}
    REDIS_HOSTNAME: immich-redis

services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
        volumes:
            - ${UPLOAD_LOCATION}:/data
            # Thumbnails on the KIOXIA so the timeline doesn't wait on the pool.
            - ${THUMB_LOCATION}:/data/thumbs
            - /etc/localtime:/etc/localtime:ro
        environment: *immich-env
        ports:
            - 2283:2283
        depends_on:
            - immich-redis
            - immich-db
        networks:
            - mariusz-network
        # NVENC video transcoding (set in Administration > Video transcoding).
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, video]
        healthcheck:
            disable: false
        restart: always

    immich-machine-learning:
        container_name: immich_machine_learning
        image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}-cuda
        volumes:
            - model-cache:/cache
        environment: *immich-env
        networks:
            - mariusz-network
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        healthcheck:
            disable: false
        restart: always

    immich-db:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: --data-checksums
        volumes:
            - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
        shm_size: 128mb
        networks:
            - mariusz-network
        healthcheck:
            disable: false
        restart: always

    immich-redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
        healthcheck:
            test: redis-cli ping | grep -q PONG || exit 1
        networks:
            - mariusz-network
        restart: always

networks:
    mariusz-network:

volumes:
    model-cache:
