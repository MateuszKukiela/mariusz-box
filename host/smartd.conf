# All disks: full attribute monitoring, automatic offline tests and attribute
# autosave, a short self-test every Sunday 03:00 and a long one on the 1st of
# the month 04:00, and a warning above 45 C (critical 55 C). Results go to the
# journal: journalctl -u smartd
DEVICESCAN -a -o on -S on -s (S/../../7/03|L/../01/./04) -W 4,45,55
