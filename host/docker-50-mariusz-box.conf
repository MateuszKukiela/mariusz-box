# mariusz-box: Docker's storage is on the KIOXIA and the containers need the ZFS pool.
# Without the pool mounted, Docker stays down instead of letting containers write
# into an empty /mariusz on the OS disk.
[Unit]
After=zfs-mount.service zfs.target local-fs.target
RequiresMountsFor=/srv/mariusz-box /var/lib/docker /var/lib/containerd
ConditionPathIsMountPoint=/mariusz
