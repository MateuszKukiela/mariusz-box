---
# Search and AI chat front-ends, and the travel map.
services:
    # Map of everywhere we've been, from Immich photos and Google Timeline exports.
    # Only reachable through Caddy behind tinyauth, so no host port and no
    # BASIC_AUTH. The Immich URL and API key are set in the page (⚙ Settings) and
    # saved to /data; use http://immich-server:2283 to stay on the Docker network.
    # /api/owntracks skips tinyauth (see Caddyfile) and uses OWNTRACKS_AUTH instead.
    fog-map:
        image: ghcr.io/mateuszkukiela/fog-map:latest
        container_name: fog-map
        environment:
            - TZ=${TZ}
            - OWNTRACKS_AUTH=phone:${PASSWORD}
        volumes:
            - ${ROOT_APPDATA}/fog-map:/data
        networks:
            - mariusz-network
        restart: unless-stopped

    # Monthly accounting: Fakturownia invoice, mBank PDFs, KSeF XML, one email to
    # the accountant. Holds the Gmail app password and bank documents, so only
    # through Caddy behind tinyauth: no host port. State is files under /app/data.
    ksiegowy:
        image: ghcr.io/mateuszkukiela/ksiegowy:latest
        container_name: ksiegowy
        environment:
            - TZ=${TZ}
            - DATA_DIR=/app/data
            - FAKTUROWNIA_DOMAIN=${KSIEGOWY_FAKTUROWNIA_DOMAIN}
            - FAKTUROWNIA_TOKEN=${KSIEGOWY_FAKTUROWNIA_TOKEN}
            - FAKTUROWNIA_CLIENT_ID=${KSIEGOWY_FAKTUROWNIA_CLIENT_ID}
            - FAKTUROWNIA_KSEF_SEND=${KSIEGOWY_FAKTUROWNIA_KSEF_SEND}
            - CLIENT_EMAIL=${KSIEGOWY_CLIENT_EMAIL}
            - INVOICE_NAME=${KSIEGOWY_INVOICE_NAME}
            - INVOICE_NET=${KSIEGOWY_INVOICE_NET}
            - INVOICE_VAT=${KSIEGOWY_INVOICE_VAT}
            - INVOICE_NP_TAX_KIND=${KSIEGOWY_INVOICE_NP_TAX_KIND}
            - INVOICE_CURRENCY=${KSIEGOWY_INVOICE_CURRENCY}
            - INVOICE_LANG=${KSIEGOWY_INVOICE_LANG}
            - INVOICE_PAYMENT_DAYS=${KSIEGOWY_INVOICE_PAYMENT_DAYS}
            - KSEF_NIP=${KSIEGOWY_KSEF_NIP}
            - KSEF_TOKEN=${KSIEGOWY_KSEF_TOKEN}
            - GMAIL_USER=${KSIEGOWY_GMAIL_USER}
            - GMAIL_APP_PASSWORD=${KSIEGOWY_GMAIL_APP_PASSWORD}
            - ACCOUNTANT_EMAIL=${KSIEGOWY_ACCOUNTANT_EMAIL}
        volumes:
            - ${ROOT_APPDATA}/ksiegowy:/app/data
        networks:
            - mariusz-network
        restart: unless-stopped

    openwebui:
        image: ghcr.io/open-webui/open-webui:main
        container_name: openwebui
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            # Without a fixed key it makes a new one on every recreate, so each
            # watchtower update logged everyone out.
            - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}
            - CORS_ALLOW_ORIGIN=https://chat.januszex.net
        volumes:
            - ${ROOT_APPDATA}/openwebui:/app/backend/data
        ports:
            - 8086:8080
        networks:
            - mariusz-network
        restart: unless-stopped

    searxng:
        image: docker.io/searxng/searxng:latest
        container_name: searxng
        environment:
            - TZ=${TZ}
            # Served only through Caddy (basic auth), so no host port is
            # published. The secret key is generated into settings.yml on first
            # start, and the limiter stays off because only we can reach it.
            - SEARXNG_BASE_URL=https://search.januszex.net/
        volumes:
            - ${ROOT_APPDATA}/searxng/config:/etc/searxng
            - ${ROOT_APPDATA}/searxng/cache:/var/cache/searxng
        networks:
            - mariusz-network
        restart: unless-stopped

    sillytavern:
        image: ghcr.io/sillytavern/sillytavern:latest
        container_name: sillytavern
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        volumes:
            - ${ROOT_APPDATA}/sillytavern/config:/home/node/app/config
            - ${ROOT_APPDATA}/sillytavern/data:/home/node/app/data
            - ${ROOT_APPDATA}/sillytavern/plugins:/home/node/app/plugins
        networks:
            - mariusz-network
        restart: unless-stopped

networks:
    mariusz-network:
